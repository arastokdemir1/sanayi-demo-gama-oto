</style><meta name="robots" content="noindex, nofollow"><link rel="icon" href="data:,"></head><body><div class="sentetik">SENTETİK TEST SİTESİ</div><p>Oturum açılıyor…</p><script>function oturumVar(){try{if(/(^|; )oturum=acik(;|$)/.test(document.cookie))return true;var t=localStorage.getItem('sanayi_demo_oturum');return !!t&&Date.now()<Number(t);}catch(e){return false;}}function oturumAc(){var gun=30*24*3600;try{document.cookie='oturum=acik; Path=/; Max-Age='+gun+'; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');}catch(e){}try{localStorage.setItem('sanayi_demo_oturum',String(Date.now()+gun*1000));}catch(e){}}function norm(t){t=String(t||'').replace(/\u0130/g,'I').replace(/\u0131/g,'I').replace(/i/g,'I');return t.replace(/[^0-9A-Za-z]/g,'').toUpperCase();}function prm(k){var v=new URLSearchParams(location.search).get(k);return v==null?'':v;}function num(v,d){var n=parseInt(v,10);return isNaN(n)?d:n;}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}oturumAc();var sn=prm('sonra');if(sn.charAt(0)!=='/'||sn.substr(0,2)==='//')sn='/';location.replace(sn);</script></body></html>
